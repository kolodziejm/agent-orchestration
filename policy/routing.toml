version = 1

[roles.worker]
description = "Implements code, test, configuration, or documentation changes whose approach is settled: a plan, an existing pattern, or an explicit list. The default for implementation, including large changes."
mode = "subagent"
edit = "allow"
bash = "allow"

[roles.worker-complex]
description = "Implements changes whose approach needs hard reasoning: auth and security, bugs with an unknown root cause, merges that must keep both sides' intent, algorithms, concurrency, or state machines. Not for following an established pattern, however large."
mode = "subagent"
edit = "allow"
bash = "allow"

[roles.validator]
description = "Runs the full gates (tests, lint, typecheck, builds, and browser or device checks) after an implementer finishes and reports the results without changing files. Use to verify a change independently of its author."
mode = "subagent"
edit = "deny"
bash = "ask"

[roles.debugger]
description = "Reproduces a failure and finds its root cause without changing files. Use when only a diagnosis is wanted: a test, build, or runtime failure with an unknown cause and no fix requested."
mode = "subagent"
edit = "deny"
bash = "ask"

[roles.explorer]
description = "Searches and reads the repository to answer questions about how the code works without changing files. Use for code search, tracing execution paths, and gathering evidence."
mode = "subagent"
edit = "deny"
bash = "ask"

[roles.planner]
description = "Produces implementation plans, specifications, ADRs, and task breakdowns without changing files. Use before work that needs design or decomposition."
mode = "subagent"
edit = "deny"
bash = "deny"

[roles.design-partner]
description = "Designs product flows and interaction behavior together with the user and proposes lightweight prototypes. Use when UX decisions are still open before implementation."
mode = "subagent"
edit = "deny"
bash = "deny"

[roles.reviewer]
description = "Reviews a proposed or completed change for correctness, security, regressions, and design without changing files. Use for an independent opinion on a diff or a plan."
mode = "subagent"
edit = "deny"
bash = "ask"

[roles.ux-critic]
description = "Audits a user interface for usability, accessibility, and platform fit and reports findings without changing files. Use when a UX review is requested."
mode = "subagent"
edit = "deny"
bash = "deny"
