version = 1

[roles.worker]
description = "Implements well-defined code, test, configuration, or documentation changes. Use for routine implementation work with clear requirements."
mode = "subagent"
edit = "allow"
bash = "allow"

[roles.worker-complex]
description = "Implements changes that need difficult reasoning, such as algorithms, state machines, concurrency, or coordinated multi-layer changes. Use when the requirements are clear but the implementation is hard."
mode = "subagent"
edit = "allow"
bash = "allow"

[roles.validator]
description = "Runs tests, lint, typecheck, builds, and browser or device checks and reports the results without changing files. Use to verify a change independently of its author."
mode = "subagent"
edit = "deny"
bash = "ask"

[roles.debugger]
description = "Reproduces a failure and finds its root cause without changing files. Use when a test, build, or runtime behavior fails and the cause is unknown."
mode = "subagent"
edit = "deny"
bash = "ask"

[roles.explorer]
description = "Searches and reads the repository to answer questions about how the code works without changing files. Use for code search, tracing execution paths, and gathering evidence."
mode = "subagent"
edit = "deny"
bash = "ask"

[roles.planner]
description = "Produces implementation plans, specifications, ADRs, and task breakdowns without changing files. Use before work that needs design or decomposition."
mode = "subagent"
edit = "deny"
bash = "deny"

[roles.design-partner]
description = "Designs product flows and interaction behavior together with the user and proposes lightweight prototypes. Use when UX decisions are still open before implementation."
mode = "subagent"
edit = "deny"
bash = "deny"

[roles.reviewer]
description = "Reviews a proposed or completed change for correctness, security, regressions, and design without changing files. Use for an independent opinion on a diff or a plan."
mode = "subagent"
edit = "deny"
bash = "ask"

[roles.ux-critic]
description = "Audits a user interface for usability, accessibility, and platform fit and reports findings without changing files. Use when a UX review is requested."
mode = "subagent"
edit = "deny"
bash = "deny"
