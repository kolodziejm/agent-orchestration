{{DOC_START}}<title>{{TITLE}}</title>
{{HEAD_META}}
<style>
/* Reference document: sticky TOC rail on wide screens, one reading column, PRs colour-coded by palette slot */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --fg:#1b2230; --muted:#5b6577; --line:#dde2ea; --soft:#eef1f6;
  --accent:#00a0a0; --accent-ink:#00706f;
  --pal-1:#7a4fd6; --pal-2:#d0731d; --pal-3:#1f7ae0; --pal-4:#1a9b5a; --pal-5:#0e8f8a; --pal-6:#c2417a; --pal-7:#8a6a2f; --pal-8:#4b5d78;
  --dep:#1f7ae0; --use:#d0731d;
  --warn-bg:#fff6e5; --warn-fg:#8a5300; --risk-bg:#fdecee; --risk-fg:#a3263a; --ok-bg:#e8f6ee; --ok-fg:#17643c;
  --code-bg:#f1f3f7;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --f-display:ui-serif,"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161d; --surface:#1a2029; --fg:#e4e8ef; --muted:#9aa4b5; --line:#2c3441; --soft:#212835;
  --accent:#2cc6c4; --accent-ink:#5fd9d7;
  --pal-1:#a78bf0; --pal-2:#f0a35a; --pal-3:#6aa9f5; --pal-4:#4fc98a; --pal-5:#3cc9c3; --pal-6:#f07fb0; --pal-7:#d1b07a; --pal-8:#9fb0cc;
  --dep:#6aa9f5; --use:#f0a35a;
  --warn-bg:#33270f; --warn-fg:#f2c26b; --risk-bg:#3a1a20; --risk-fg:#f39aa8; --ok-bg:#15301f; --ok-fg:#8fdcae;
  --code-bg:#222a36; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --surface:#1a2029; --fg:#e4e8ef; --muted:#9aa4b5; --line:#2c3441; --soft:#212835;
  --accent:#2cc6c4; --accent-ink:#5fd9d7;
  --pal-1:#a78bf0; --pal-2:#f0a35a; --pal-3:#6aa9f5; --pal-4:#4fc98a; --pal-5:#3cc9c3; --pal-6:#f07fb0; --pal-7:#d1b07a; --pal-8:#9fb0cc;
  --dep:#6aa9f5; --use:#f0a35a;
  --warn-bg:#33270f; --warn-fg:#f2c26b; --risk-bg:#3a1a20; --risk-fg:#f39aa8; --ok-bg:#15301f; --ok-fg:#8fdcae;
  --code-bg:#222a36; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 64px}
.wrap{max-width:1900px;margin:0 auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:40px}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}nav.toc{display:none}}
@media (min-width:1500px){.wrap{grid-template-columns:200px minmax(0,1fr);gap:28px}}
nav.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 24px);align-self:start;font-size:14px}
nav.toc p{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
nav.toc ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
nav.toc a{display:block;padding:4px 10px;border-radius:6px;color:var(--fg);text-decoration:none}
nav.toc a:hover,nav.toc a:focus-visible{background:var(--soft)}
main{min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:48px}
header h1{font-family:var(--f-display);font-size:clamp(28px,4vw,40px);line-height:1.15;margin:0 0 8px;text-wrap:balance}
header .sub{color:var(--muted);margin:0;max-width:70ch}
h2{font-family:var(--f-display);font-size:26px;margin:0 0 4px;text-wrap:balance}
h3{font-size:18px;margin:24px 0 8px}
h4{font-size:15px;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
section>p.lead{color:var(--muted);margin:0 0 16px;max-width:75ch}
p,li{max-width:80ch}
a{color:var(--accent-ink)}
a:focus-visible,summary:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
code,.mono{font-family:var(--f-mono);font-size:.86em}
code{background:var(--code-bg);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
pre.code{background:var(--code-bg);padding:14px 16px;border-radius:8px;overflow-x:auto;font-family:var(--f-mono);font-size:13px;line-height:1.5;margin:8px 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.pr-card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c,var(--accent));border-radius:10px;padding:16px;display:grid;gap:6px;align-content:start}
.pr-card .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--c,var(--accent));font-weight:700}
.pr-card .t{font-weight:700;font-size:17px;line-height:1.3}
.pr-card .meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pr-card ul{margin:4px 0 0;padding-left:18px;font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--c,var(--muted));border:1px solid var(--line);vertical-align:middle}
button.tag{cursor:pointer;font:inherit;font-size:13px;font-weight:700}
.arrow{color:var(--muted);text-align:center;font-size:14px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--soft);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.callout{border-radius:8px;padding:12px 16px;margin:12px 0;font-size:15px}
.callout.warn{background:var(--warn-bg);color:var(--warn-fg)}
.callout.risk{background:var(--risk-bg);color:var(--risk-fg)}
.callout.ok{background:var(--ok-bg);color:var(--ok-fg)}
.callout strong{color:inherit}
details{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:10px 0}
details>summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;gap:10px;align-items:center}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
details>.body{padding:0 16px 16px}
.files{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.files li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px;max-width:none}
.files li:last-child{border-bottom:0}
.files .path{font-family:var(--f-mono);font-size:12.5px;overflow-wrap:anywhere}
.files .d{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.files .role{grid-column:1/-1;color:var(--muted);font-size:13.5px}
ol.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0;display:grid;gap:8px}
ol.steps>li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
ol.steps>li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--c,var(--accent));color:var(--surface);font-size:13px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.risk-list{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.risk-list li{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--sev);border-radius:8px;padding:10px 14px;font-size:15px;max-width:none}
.sev-h{--sev:var(--risk-fg)} .sev-m{--sev:var(--warn-fg)} .sev-l{--sev:var(--muted)}
.risk-list .who{font-size:12px;font-weight:700;margin-right:6px}
.diagram{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;overflow-x:auto}
pre.mermaid{margin:0;background:transparent;font-family:var(--f-body)}
.cols-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.cols-2>*{min-width:0}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;font-weight:600}
.pill.ok{background:var(--ok-bg);color:var(--ok-fg)} .pill.warn{background:var(--warn-bg);color:var(--warn-fg)} .pill.risk{background:var(--risk-bg);color:var(--risk-fg)}
footer{color:var(--muted);font-size:13px}

/* Reading graph */
.g-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.g-tabs button{font:inherit;font-size:14px;font-weight:600;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.g-tabs button[aria-selected="true"]{background:var(--c);border-color:var(--c);color:var(--surface)}
.g-tools{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;font-size:14px;color:var(--muted);margin:0 0 10px}
.g-tools label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.g-tools button{font:inherit;font-size:13px;padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.g-work{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;align-items:start;margin-top:16px}
@media (max-width:1000px){.g-work{grid-template-columns:minmax(0,1fr)}}
.g-side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:grid;gap:12px;min-width:0}
@media (max-width:1000px){.g-side{position:static}}
.g-main{min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.g-canvas{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:58vh}
.g-canvas svg{display:block}
.g-detail{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:14px}
.g-detail h4{margin:0 0 6px}
.g-detail .p{font-family:var(--f-mono);font-size:12px;overflow-wrap:anywhere;color:var(--muted)}
.g-detail ul{margin:4px 0 8px;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px 14px}
.g-detail .rel{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:4px 24px}
.g-detail li button{font:inherit;background:none;border:0;padding:0;color:var(--accent-ink);cursor:pointer;text-align:left}
.g-detail .muted{margin:0;color:var(--muted)}
.g-order{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;max-height:calc(100vh - 40px);overflow:auto}
.g-order ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.g-order li{display:grid;grid-template-columns:22px 34px minmax(0,1fr);gap:6px;align-items:center;padding:4px 6px;border-radius:6px;font-size:13px}
.g-order li.sel{background:var(--soft)}
.g-order li.done .nm{text-decoration:line-through;color:var(--muted)}
.g-order .no{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.g-order .nm{background:none;border:0;padding:0;font:inherit;color:var(--fg);text-align:left;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin:0 0 10px}
.g-legend span{display:inline-flex;gap:6px;align-items:center}
.g-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
svg .nd rect{stroke-width:1.5}
svg .nd text{font-family:var(--f-body);fill:var(--fg)}
svg .nd .sub{fill:var(--muted);font-family:var(--f-mono)}
svg .nd .num{font-family:var(--f-mono);font-weight:600}
svg .nd{cursor:pointer;transition:opacity .15s}
svg .nd:focus{outline:none}
svg .nd:focus-visible rect.box{stroke:var(--accent);stroke-width:3}
svg .ed{fill:none;stroke:var(--line);stroke-width:1.4;transition:opacity .15s,stroke .15s}
svg .ed.http{stroke-dasharray:6 4}
svg .rp{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.28;pointer-events:none}
svg.has-sel .rp{opacity:.1}
svg.has-sel .nd{opacity:.22} svg.has-sel .ed{opacity:.08}
svg.has-sel .nd.on,svg.has-sel .nd.dep,svg.has-sel .nd.use{opacity:1}
svg.has-sel .ed.dep{opacity:1;stroke:var(--dep);stroke-width:2.2}
svg.has-sel .ed.use{opacity:1;stroke:var(--use);stroke-width:2.2}
svg .nd.on rect.box{stroke:var(--fg);stroke-width:3}
svg .nd.done rect.box{opacity:.55}
.k-dep{color:var(--dep);font-weight:700} .k-use{color:var(--use);font-weight:700}

/* Diff viewer */
.dv{display:grid;gap:10px}
.dv-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.dv-head h3{margin:0;font-size:18px}
.dv-head .m{font-size:13px;color:var(--muted)}
.dv-mode{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.dv-mode button{font:inherit;font-size:13px;padding:5px 12px;border:0;border-radius:0;background:var(--surface);color:var(--fg);cursor:pointer}
.dv-mode button[aria-pressed="true"]{background:var(--fg);color:var(--surface)}
.dv-empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--muted);font-size:14px}
.df{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.df>summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 14px;background:var(--soft);font-family:var(--f-mono);font-size:12.5px}
.df>summary::-webkit-details-marker{display:none}
.df>summary .pth{overflow-wrap:anywhere;min-width:0}
.df>summary .st{white-space:nowrap;font-variant-numeric:tabular-nums}
.st .a{color:var(--ok-fg)} .st .r{color:var(--risk-fg)}
.df-body{overflow-x:auto;max-height:70vh;overflow-y:auto}
.df-note{padding:8px 14px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
table.dt{border-collapse:collapse;width:100%;font-family:var(--f-mono);font-size:12.5px;line-height:1.5;table-layout:fixed}
table.dt td{padding:0 8px;border:0;vertical-align:top;white-space:pre-wrap;word-break:break-word}
table.dt td.ln{width:46px;text-align:right;color:var(--muted);user-select:none;padding-right:6px;font-size:11.5px;opacity:.8}
table.dt.sbs td.cd{width:calc(50% - 46px)}
table.dt tr.hk td{background:var(--soft);color:var(--muted);padding:3px 8px;font-size:11.5px}
td.del{background:var(--d-del)} td.add{background:var(--d-add)} td.emp{background:var(--d-emp)}
td.ln.del{background:var(--d-del-ln)} td.ln.add{background:var(--d-add-ln)}
td.cd .mk{user-select:none;color:var(--muted);display:inline-block;width:1.1em}
:root{--d-add:#e6f7ec;--d-add-ln:#cdeedd;--d-del:#fdebec;--d-del-ln:#f8d4d7;--d-emp:#f3f4f7;
  --hl-k:#a2338a;--hl-s:#1a7f37;--hl-n:#0550ae;--hl-c:#6e7781;--hl-t:#953800;--hl-f:#6639ba;--hl-a:#0a3069}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--d-add:#14301f;--d-add-ln:#1c4029;--d-del:#3a1a1e;--d-del-ln:#4a2126;--d-emp:#1d232d;
  --hl-k:#ff7bd8;--hl-s:#7ee2a8;--hl-n:#79c0ff;--hl-c:#8b949e;--hl-t:#ffa657;--hl-f:#d2a8ff;--hl-a:#a5d6ff}}
:root[data-theme="dark"]{--d-add:#14301f;--d-add-ln:#1c4029;--d-del:#3a1a1e;--d-del-ln:#4a2126;--d-emp:#1d232d;
  --hl-k:#ff7bd8;--hl-s:#7ee2a8;--hl-n:#79c0ff;--hl-c:#8b949e;--hl-t:#ffa657;--hl-f:#d2a8ff;--hl-a:#a5d6ff}
.hljs-keyword,.hljs-meta .hljs-keyword,.hljs-built_in,.hljs-literal{color:var(--hl-k)}
.hljs-string,.hljs-regexp,.hljs-template-tag{color:var(--hl-s)}
.hljs-number,.hljs-variable.constant_{color:var(--hl-n)}
.hljs-comment,.hljs-quote{color:var(--hl-c);font-style:italic}
.hljs-type,.hljs-title.class_,.hljs-tag{color:var(--hl-t)}
.hljs-title.function_,.hljs-title,.hljs-section{color:var(--hl-f)}
.hljs-attr,.hljs-attribute,.hljs-property,.hljs-name,.hljs-variable{color:var(--hl-a)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
{{PR_CSS}}
</style>

<div class="wrap">
<nav class="toc" aria-label="{{S:toc}}">
  <p>{{S:toc}}</p>
  <ol>
{{TOC}}
  </ol>
</nav>

<main>
{{NARRATIVE_HEAD}}

<section id="graph">
  <h2>{{S:graphTitle}}</h2>
  <p class="lead">{{S:graphLead}}</p>
  <div class="g-tabs" role="tablist" aria-label="{{S:tabsLabel}}" id="g-tabs"></div>
  <div class="g-tools">
    <span class="dv-mode" role="group" aria-label="{{S:orderLabel}}"><button type="button" data-o="top">{{S:fromEntry}}</button><button type="button" data-o="bottom">{{S:fromDeps}}</button></span>
    <label><input type="checkbox" id="g-path" checked> {{S:showPath}}</label>
    <label><input type="checkbox" id="g-tests" checked> {{S:showTests}}</label>
    <label><input type="checkbox" id="g-ext" checked> {{S:showExternal}}</label>
    <span><button type="button" id="g-prev">{{S:prev}}</button> <button type="button" id="g-next">{{S:next}}</button></span>
    <span>{{HINT}}</span>
  </div>
  <div class="g-legend" id="g-legend"></div>
  <div class="g-canvas" id="g-canvas"></div>
  <div class="g-work">
    <aside class="g-side" aria-label="{{S:orderLabel}}"><div class="g-order"><ol id="g-order"></ol></div></aside>
    <div class="g-main">
      <div class="g-detail" id="g-detail" aria-live="polite"><p class="muted">{{S:detailEmpty}}</p></div>
      <div class="dv" id="dv">
        <div class="dv-head">
          <div><h3 id="dv-title">{{S:diffTitle}}</h3><div class="m" id="dv-meta">{{S:diffPick}}</div></div>
          <div class="dv-mode" role="group" aria-label="{{S:diffModeLabel}}">
            <button type="button" data-m="sbs" aria-pressed="true">{{S:sideBySide}}</button>
            <button type="button" data-m="uni" aria-pressed="false">{{S:unified}}</button>
          </div>
        </div>
        <div id="dv-files"><div class="dv-empty">{{S:diffEmpty}}</div></div>
      </div>
    </div>
  </div>
</section>

{{NARRATIVE_BODY}}
</main>
</div>

<script type="application/json" id="review-config">{{CONFIG_JSON}}</script>
<script type="application/json" id="graph-data">{{GRAPH_JSON}}</script>
<script type="application/json" id="diff-data">{{DIFF_JSON}}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(function(){
  var CFG=JSON.parse(document.getElementById('review-config').textContent);
  var data=JSON.parse(document.getElementById('graph-data').textContent);
  var DIFFS=JSON.parse(document.getElementById('diff-data').textContent);
  var S=CFG.strings;
  var LAYER_COLORS={contract:'#1f7ae0',domain:'#7a4fd6',logic:'#0e9f9a',infra:'#d0731d',rest:'#c2410c',wiring:'#a3263a',ui:'#1a9b5a',data:'#8a6a2f',test:'#6b7280',config:'#8a5300',docs:'#5b6577',i18n:'#2f855a'};
  var LATE={docs:1,config:1,i18n:1};
  var PR={};(CFG.prs||[]).forEach(function(p){PR[p.key]=p;});
  function prName(k){return PR[k]?PR[k].name:k;}
  function prColor(k){return PR[k]?PR[k].color:'var(--accent)';}
  function layerOf(l){return [(S.layers&&S.layers[l])||l||'?',LAYER_COLORS[l]||'#888'];}
  var KEY='review-map:'+CFG.storageKey+':';
  function load(k,d){try{var v=localStorage.getItem(KEY+k);return v==null?d:v;}catch(e){return d;}}
  function save(k,v){try{localStorage.setItem(KEY+k,v);}catch(e){}}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  var plural=null;try{plural=new Intl.PluralRules(CFG.lang||'en');}catch(e){}
  function filesWord(n){var f=S.files||{};var c=plural?plural.select(n):(n===1?'one':'other');return f[c]||f.other||'';}
  function stepLabel(n){return n.ext?n.id:S.step+' '+n.order;}

  /* Diff viewer */
  var mode=(window.innerWidth<760)?'uni':'sbs',last=null;
  mode=load('diffmode',mode);
  var mbtns=document.querySelectorAll('[data-m]');
